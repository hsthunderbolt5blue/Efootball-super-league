<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Efootball Super League Season 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1420;
    --card: #161d2e;
    --accent: #4f8cff;
    --accent-2: #22c55e;
    --text: #e8ecf4;
    --muted: #8b93a7;
    --border: #232b3d;
    --row-alt: #131a29;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Merriweather", "Times New Roman", Times, serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }

  .wrap { max-width: 1000px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 20px; }

  header img.league-logo {
    max-width: 180px;
    height: auto;
    margin-bottom: 10px;
  }

  header h1 {
    font-size: clamp(22px, 4vw, 32px);
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p { color: var(--muted); margin: 0; font-size: 14px; }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    padding: 10px 18px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .tab-btn.active {
    color: var(--text);
    border-bottom: 2px solid var(--accent);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .search {
    flex: 1;
    min-width: 180px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
  }
  .search:focus { outline: 2px solid var(--accent); }

  .status { font-size: 13px; color: var(--muted); white-space: nowrap; }

  .table-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .table-scroll { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }

  thead th {
    position: sticky;
    top: 0;
    background: #1c2436;
    color: var(--text);
    text-align: left;
    padding: 12px 14px;
    font-weight: 600;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }

  tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: #1a2338; }

  .club-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .club-badge {
    width: 20px;
    height: 20px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .empty, .error {
    text-align: center;
    padding: 40px 16px;
    color: var(--muted);
  }
  .error { color: #f87171; }

  footer {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="league-logo" src="assets/logo.jpeg" alt="Efootball Super League Season 1 logo">
    <h1>Efootball Super League Season 1</h1>
    <p>16 players &middot; double round-robin &middot; 30 matches</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="standings">Standings</button>
    <button class="tab-btn" data-tab="matches">Matches</button>
  </div>

  <!-- STANDINGS PANEL -->
  <div id="panel-standings" class="panel active">
    <div class="toolbar">
      <input id="searchStandings" class="search" type="text" placeholder="Search a club...">
      <span id="statusStandings" class="status">Loading standings...</span>
    </div>
    <div class="table-card">
      <div class="table-scroll">
        <table id="tableStandings" style="display:none;">
          <thead><tr id="headStandings"></tr></thead>
          <tbody id="bodyStandings"></tbody>
        </table>
        <div id="emptyStandings" class="empty">Loading...</div>
      </div>
    </div>
  </div>

  <!-- MATCHES PANEL -->
  <div id="panel-matches" class="panel">
    <div class="toolbar">
      <input id="searchMatches" class="search" type="text" placeholder="Search a player...">
      <span id="statusMatches" class="status">Loading matches...</span>
    </div>
    <div class="table-card">
      <div class="table-scroll">
        <table id="tableMatches" style="display:none;">
          <thead><tr id="headMatches"></tr></thead>
          <tbody id="bodyMatches"></tbody>
        </table>
        <div id="emptyMatches" class="empty">Loading...</div>
      </div>
    </div>
  </div>

  <footer>
    Data is pulled live from Google Sheets &middot; refreshes automatically every 60s
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  // === CONFIGURE THESE ===
  // Paste your two "Publish to web" CSV links from Google Sheets here.
  const STANDINGS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR15py1cqLDHUW-WvvqMk97cCKUs_gdT9U1L4q4VMhbYFHq_U3suuv5Euy7Qm1ltMs6fOLQzZ9zY8Nv/pub?gid=545012572&single=true&output=csv";
  const MATCHES_CSV_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR15py1cqLDHUW-WvvqMk97cCKUs_gdT9U1L4q4VMhbYFHq_U3suuv5Euy7Qm1ltMs6fOLQzZ9zY8Nv/pub?gid=161752434&single=true&output=csv";
  // ========================

  const REFRESH_MS = 60000; // auto-refresh every 60 seconds

  // Turns a club name into a filename-friendly slug, e.g. "FC Barcelona" -> "fc-barcelona"
  function clubSlug(name) {
    return String(name)
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9\s-]/g, "")
      .replace(/\s+/g, "-");
  }

  // Generic table controller, one instance per tab
  function createTableController({ csvUrl, headEl, bodyEl, tableEl, emptyEl, statusEl, searchEl, sortBy, showBadges }) {
    let headers = [];
    let allRows = [];
    let clubColIndex = -1;

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function render(rows) {
      headEl.innerHTML = headers.map(h => `<th>${escapeHtml(h)}</th>`).join("");
      if (!rows.length) {
        bodyEl.innerHTML = `<tr><td colspan="${headers.length}">No data found.</td></tr>`;
        return;
      }
      bodyEl.innerHTML = rows.map(row => {
        const cells = headers.map((val, i) => {
          const raw = row[i] ?? "";
          if (showBadges && i === clubColIndex) {
            const slug = clubSlug(raw);
            return `<td><div class="club-cell">
              <img class="club-badge" src="assets/logos/${slug}.png" alt=""
                   onerror="this.style.display='none'">
              <span>${escapeHtml(raw)}</span>
            </div></td>`;
          }
          return `<td>${escapeHtml(raw)}</td>`;
        }).join("");
        return `<tr>${cells}</tr>`;
      }).join("");
    }

    async function load() {
      try {
        statusEl.textContent = "Refreshing...";
        const res = await fetch(csvUrl + (csvUrl.includes("?") ? "&" : "?") + "cachebust=" + Date.now());
        if (!res.ok) throw new Error("Network response was not OK");
        const csvText = await res.text();
        const parsed = Papa.parse(csvText.trim(), { skipEmptyLines: true });
        const rows = parsed.data;
        if (!rows.length) throw new Error("No data found in sheet");

        headers = rows[0];
        allRows = rows.slice(1);
        clubColIndex = headers.findIndex(h => String(h).trim().toLowerCase() === "club");

        if (sortBy) {
          const ptsIdx = headers.indexOf(sortBy.primary);
          const gdIdx = headers.indexOf(sortBy.tiebreak);
          if (ptsIdx !== -1) {
            allRows.sort((a, b) => {
              const ptsDiff = (parseFloat(b[ptsIdx]) || 0) - (parseFloat(a[ptsIdx]) || 0);
              if (ptsDiff !== 0) return ptsDiff;
              if (gdIdx !== -1) return (parseFloat(b[gdIdx]) || 0) - (parseFloat(a[gdIdx]) || 0);
              return 0;
            });
          }
        }

        render(allRows);

        tableEl.style.display = "table";
        emptyEl.style.display = "none";
        statusEl.textContent = "Updated " + new Date().toLocaleTimeString();
      } catch (err) {
        console.error(err);
        tableEl.style.display = "none";
        emptyEl.style.display = "block";
        emptyEl.classList.add("error");
        emptyEl.textContent = "Could not load data. Check the CSV link in index.html.";
        statusEl.textContent = "Error loading data";
      }
    }

    searchEl.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) { render(allRows); return; }
      // allRows is already sorted, so filtering preserves the sorted order
      render(allRows.filter(row => row.some(cell => String(cell).toLowerCase().includes(q))));
    });

    load();
    setInterval(load, REFRESH_MS);
  }

  createTableController({
    csvUrl: STANDINGS_CSV_URL,
    headEl: document.getElementById("headStandings"),
    bodyEl: document.getElementById("bodyStandings"),
    tableEl: document.getElementById("tableStandings"),
    emptyEl: document.getElementById("emptyStandings"),
    statusEl: document.getElementById("statusStandings"),
    searchEl: document.getElementById("searchStandings"),
    sortBy: { primary: "PTS", tiebreak: "GD" },
    showBadges: true,
  });

  createTableController({
    csvUrl: MATCHES_CSV_URL,
    headEl: document.getElementById("headMatches"),
    bodyEl: document.getElementById("bodyMatches"),
    tableEl: document.getElementById("tableMatches"),
    emptyEl: document.getElementById("emptyMatches"),
    statusEl: document.getElementById("statusMatches"),
    searchEl: document.getElementById("searchMatches"),
  });

  // Tab switching
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
  });
</script>
</body>
</html>
